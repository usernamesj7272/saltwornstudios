<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css?v=20260705-2">

  <body>
    <main class="coming-soon-page" aria-labelledby="page-title">
      <img
        class="logo"
        src="assets/logos/saltworn-studios-seal.png"
        alt="Saltworn Studios"
        width="1024"
        height="1024"
      >

      <section class="dictionary-entry">
        <h1 id="page-title">
          <span>saltworn</span>
          <abbr title="adjective">(adj.)</abbr>
        </h1>
        <p class="definition">Shaped by tide, season, and time.</p>
      </section>

      <p class="note">Coming soon.</p>

      <form class="inquiry-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="3dee655e-f5c9-4964-9158-71ee87e414f1">
        <input type="hidden" name="subject" value="Saltworn Studios web work, writing, skincare, and gemstone inquiry">

        <p class="form-intro">Please reach out for web work, editorial writing, botanical skincare refills, and bespoke gemstone pieces.</p>

        <label>
          <span>Name</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>

        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>

        <label>
          <span>Message</span>
          <textarea name="message" rows="4" required></textarea>
        </label>

        <button type="submit">Send Inquiry</button>
      </form>
    </main>

    <footer class="site-footer">
